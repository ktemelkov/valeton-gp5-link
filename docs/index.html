<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17694f">
  <meta name="description" content="Valeton GP5 Link BLE MIDI terminal.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>GP5 Link | BLE MIDI Terminal</title>
  <style>
    :root { color-scheme: light; --paper: #f5f7f5; --ink: #202723; --muted: #606b65; --line: #d4dcd6; --green: #17694f; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 16px "Segoe UI", sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; }
    button, select, input { border: 1px solid var(--line); border-radius: 5px; min-height: 44px; }
    button { cursor: pointer; background: white; color: var(--ink); padding: 9px 16px; font-weight: 600; }
    button.primary { background: var(--green); color: white; border-color: var(--green); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    :focus-visible { outline: 3px solid #d18f20; outline-offset: 3px; }
    [hidden] { display: none !important; }
    header { border-bottom: 1px solid var(--line); background: #fff; }
    .header-inner, main, footer { max-width: 1120px; margin: auto; padding: 24px; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: 44px; border-radius: 5px; }
    .brand strong { font-family: "Bahnschrift", "Segoe UI", sans-serif; font-size: 23px; }
    .eyebrow { text-transform: uppercase; font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
    h1 { font-family: "Bahnschrift", "Segoe UI", sans-serif; font-size: 32px; font-weight: 600; margin: 0; }
    .heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin: 16px 0 28px; }
    .status { font-size: 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .status::before { content: ""; width: 9px; height: 9px; background: #7e8782; border-radius: 50%; }
    .status.connected::before { background: #17845e; }
    .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .panel { border: 1px solid #343f38; border-radius: 6px; background: #19211d; overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid #3a463e; color: #cad8ce; font: 12px Consolas, monospace; gap: 12px; }
    pre { margin: 0; padding: 16px; height: 360px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: #b8e5c9; font: 13px/1.65 Consolas, "Courier New", monospace; }
    form { display: grid; grid-template-columns: minmax(0, 1fr) 105px auto; gap: 10px; align-items: end; margin-top: 16px; }
    .actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }
    footer { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; }
    @media (max-width: 700px) {
      .header-inner, main, footer { padding: 18px; }
      .workspace { grid-template-columns: 1fr; }
      .panel-header { flex-direction: column; align-items: flex-start; }
      form { grid-template-columns: minmax(0, 1fr) 90px; }
      form button { grid-column: 1 / -1; }
      pre { height: 320px; }
    }
    @media (prefers-reduced-motion: no-preference) { main { animation: appear .3s ease-out; } @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <header><div class="header-inner">
    <div class="brand"><img src="./icon-192.png" alt="" width="44" height="44"><strong>GP5 Link</strong></div>
    <button id="install" hidden>Install app</button>
  </div></header>
  <main>
    <div class="heading"><div><p class="eyebrow">Device workspace</p><h1>BLE MIDI Terminal</h1></div><span id="status" class="status">Disconnected</span></div>
    <p id="compatibility" class="notice" hidden></p>
    <p id="message" class="notice" role="status"></p>
    <div class="workspace">
      <section class="panel" aria-label="Connection controls">
        <div class="panel-header"><span>Connection</span><div><button id="connect" class="primary">Connect</button><button id="disconnect" disabled>Disconnect</button></div></div>
        <div class="panel-body" style="padding: 16px;">
          <p id="device-info">No device selected</p>
        </div>
      </section>
      <section class="panel" aria-label="MIDI messages">
        <div class="panel-header"><span>Received MIDI</span></div>
        <pre id="received" tabindex="0" aria-label="MIDI output"></pre>
        <form id="send-form">
          <label>Hex input<input id="hexInput" type="text" autocomplete="off" spellcheck="false"></label>
          <button id="send" class="primary" disabled>Send</button>
        </form>
      </section>
    </div>
  </main>
  <footer><span>Valeton GP5 Link</span><span id="offline-status" role="status">Offline cache pending</span></footer>
  <script>
    const element = (id) => document.getElementById(id);
    const supported = 'bluetooth' in navigator && navigator.bluetooth && navigator.bluetooth.requestDevice;
    // BLE MIDI service and characteristic UUIDs used by the device (128‑bit, lowercase)
    const MIDI_SERVICE_UUID = '03b80e5a-ede8-4b33-a751-6ce34ec4c700';
    const MIDI_CHAR_UUID = '7772e5db-3868-4112-a1a9-f2669d106bf3';
    let device = null;
    let server = null;
    let midiService = null;
    let midiChar = null;
    let connected = false;

    function updateControls() {
      element('connect').disabled = !supported || connected;
      element('disconnect').disabled = !connected;
      element('send').disabled = !connected;
      element('hexInput').disabled = !connected;
      element('status').textContent = connected ? 'Connected' : 'Disconnected';
      element('status').classList.toggle('connected', connected);
    }

    function append(text) {
      const output = element('received');
      output.textContent = (output.textContent + text).slice(-100000);
      output.scrollTop = output.scrollHeight;
    }

    async function connect() {
      if (!supported) {
        element('message').textContent = 'Web Bluetooth not supported in this browser.';
        return;
      }
      try {
        device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [MIDI_SERVICE_UUID] }],
          optionalServices: [MIDI_SERVICE_UUID]
        });
        device.addEventListener('gattserverdisconnected', onDisconnected);
        element('device-info').textContent = `Device: ${device.name || 'Unnamed'} (ID: ${device.id})`;
        server = await device.gatt.connect();
        midiService = await server.getPrimaryService(MIDI_SERVICE_UUID);
        midiChar = await midiService.getCharacteristic(MIDI_CHAR_UUID);
        await midiChar.startNotifications();
        midiChar.addEventListener('characteristicvaluechanged', handleMIDI);
        connected = true;
        append('[Connected]');
        updateControls();
      } catch (error) {
        element('message').textContent = `Connection failed: ${error.message}`;
      }
    }

    function onDisconnected() {
      connected = false;
      append('[Disconnected]');
      updateControls();
    }

    function disconnect() {
      if (device && device.gatt.connected) {
        device.gatt.disconnect();
      }
    }

    function handleMIDI(event) {
      const value = event.target.value;
      const bytes = new Uint8Array(value.buffer);
      const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
      append(`\n${hex}`);
    }

    function parseHexString(str) {
      const cleaned = str.replace(/\s+/g, '');
      if (cleaned.length % 2 !== 0) return null;
      const bytes = [];
      for (let i = 0; i < cleaned.length; i += 2) {
        const byte = parseInt(cleaned.substr(i, 2), 16);
        if (isNaN(byte)) return null;
        bytes.push(byte);
      }
      return new Uint8Array(bytes);
    }

    element('connect').addEventListener('click', connect);
    element('disconnect').addEventListener('click', disconnect);
    element('send-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!connected || !midiChar) return;
      const hex = element('hexInput').value.trim();
      const data = parseHexString(hex);
      if (!data) {
        element('message').textContent = 'Invalid hex input.';
        return;
      }
      try {
        await midiChar.writeValue(data);
        append(`\n[TX] ${hex}`);
        element('hexInput').value = '';
      } catch (err) {
        element('message').textContent = `Send failed: ${err.message}`;
      }
    });

    if (supported) {
      navigator.bluetooth.addEventListener('advertisementreceived', (event) => {
        // Optional: handle advertising events if needed
      });
    } else {
      element('compatibility').hidden = false;
      element('compatibility').textContent = !window.isSecureContext
        ? 'Web Bluetooth requires HTTPS or localhost.'
        : 'Web Bluetooth is unavailable. Open this page in a browser that supports Web Bluetooth.';
    }
    updateControls();

    // PWA install prompt handling
    let installPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      installPrompt = event;
      element('install').hidden = false;
    });
    element('install').addEventListener('click', async () => {
      if (!installPrompt) return;
      const prompt = installPrompt;
      installPrompt = null;
      element('install').hidden = true;
      await prompt.prompt();
      await prompt.userChoice;
    });
    window.addEventListener('appinstalled', () => {
      installPrompt = null;
      element('install').hidden = true;
    });

    // Service worker registration for offline support
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(() => {
        element('offline-status').textContent = 'Ready for offline use';
      }).catch((error) => {
        element('offline-status').textContent = 'Offline cache unavailable';
        element('message').textContent = `Service worker registration failed: ${error.message}`;
      });
    } else {
      element('offline-status').textContent = 'Offline cache unavailable';
    }
  </script>
</body>
</html>
