<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18231e">
  <meta name="description" content="Manage guitar-switch preset groups over a binary BLE configuration service.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>GP5 Link | Preset Manager</title>
</head>
<body>
  <header><div class="header-inner">
    <div class="brand"><img src="./icon-192.png" alt="" width="44" height="44"><strong>GP5 Link</strong></div>
    <button id="install" hidden>Install app</button>
  </div></header>
  <main>
    <p id="compatibility" class="notice warning" hidden></p>
    <section class="connection" aria-label="Bluetooth connection">
      <div><span id="status" class="status">Disconnected</span><p id="device-info" hidden></p></div>
      <div class="button-row"><button id="connect" class="primary">Connect</button><button id="disconnect" disabled hidden>Disconnect</button></div>
    </section>
    <p id="message" class="notice" role="status" aria-live="polite" hidden></p>
    <div class="toolbar">
      <div class="workspace-heading"><h1>Preset groups</h1><span id="group-count" class="badge">0 groups</span></div>
      <div class="button-row"><button id="reload" title="Reload groups and refresh GP-5 preset names" disabled>Reload</button><button id="save" class="primary" title="Save groups to device" disabled>Save</button></div>
    </div>
    <p id="names-status" class="small" role="status" hidden></p>
    <section id="groups" class="groups" aria-label="Preset groups"><div class="empty"><p>Connect to load your preset groups.</p></div></section>
  </main>
  <footer><span id="offline-status" role="status">Offline cache pending</span></footer>
  <script>
    'use strict';
    const element = (id) => document.getElementById(id);
    const MIDI_SERVICE = '03b80e5a-ede8-4b33-a751-6ce34ec4c700';
    const MIDI_CHARACTERISTIC = '7772e5db-3868-4112-a1a9-f2669d106bf3';
    const CONFIGURATION_SERVICE = '9c7b1000-6e4d-4f42-9a31-2d5e8b0c7f60';
    const CONFIGURATION_CHARACTERISTIC = '9c7b1001-6e4d-4f42-9a31-2d5e8b0c7f60';
    const START_SYNC = [0x80, 0x80, 0xf0, 0, 0x0e, 0, 1, 0, 0, 0, 2, 1, 2, 4, 0, 0xf7];
    const REQUEST_NAMES = [0x80, 0x80, 0xf0, 3, 5, 0, 1, 0, 0, 0, 2, 1, 2, 2, 4, 0xf7];
    const supported = window.isSecureContext && typeof navigator.bluetooth?.requestDevice === 'function';
    const actionLabels = ['Navigate', 'Preset change'];
    let device = null, characteristic = null, configurationCharacteristic = null, busy = false, loaded = false, dirty = false;
    let groups = [], normalCount = 12, names = Array(100).fill('');
    let token = 0, pending = null, namePending = null, session = 0;

    function notify(text, error = false) {
      element('message').textContent = text;
      element('message').hidden = false;
      element('message').classList.toggle('warning', error);
    }
    function connected() { return Boolean(characteristic && configurationCharacteristic && device?.gatt.connected); }
    function updateControls() {
      const online = connected();
      element('connect').disabled = !supported || online || busy;
      element('connect').hidden = online;
      element('disconnect').disabled = !online;
      element('disconnect').hidden = !online;
      element('device-info').hidden = !online;
      element('reload').disabled = !online || busy;
      element('save').disabled = !online || busy || !loaded || !dirty;
      element('status').textContent = online ? (busy ? 'Syncing' : 'Connected') : 'Disconnected';
      element('status').classList.toggle('connected', online);
      element('group-count').textContent = `${groups.length}${dirty ? ' / unsaved' : ''}`;
      element('groups').querySelectorAll('button, select').forEach((control) => { control.disabled = busy; });
    }
    function markDirty() { dirty = true; updateControls(); }
    function presetLabel(index) { return names[index] ? `${index} - ${names[index]}` : String(index); }
    function render() {
      const root = element('groups');
      const expanded = new Set(Array.from(root.children).filter(card => card.open).map(card => Number(card.dataset.group)));
      root.replaceChildren();
      groups.forEach((actions, groupIndex) => {
        const end = actions.findIndex(action => action.action === 0);
        const visibleActions = end < 0 ? actions : actions.slice(0, end + 1);
        const card = document.createElement('details');
        card.className = 'group-card';
        card.dataset.group = groupIndex;
        card.open = expanded.has(groupIndex);
        const hold = groupIndex >= normalCount;
        const title = hold ? `Extended group ${groupIndex - normalCount + 1}` : `Group ${groupIndex + 1}`;
        const heading = document.createElement('summary');
        heading.className = 'group-heading';
        const headingText = document.createElement('div');
        const name = document.createElement('h3');
        name.textContent = title;
        headingText.append(name);
        const count = document.createElement('span');
        count.className = 'badge';
        count.textContent = `${visibleActions.length} ${visibleActions.length === 1 ? 'slot' : 'slots'}`;
        heading.append(headingText, count);
        card.append(heading);
        visibleActions.forEach((action, slot) => {
          const row = document.createElement('div');
          row.className = 'action-row';
          const number = document.createElement('span');
          number.className = 'action-number';
          number.textContent = String(slot + 1).padStart(2, '0');
          const typeLabel = document.createElement('div');
          typeLabel.className = 'action-type';
          const type = document.createElement('select');
          type.setAttribute('aria-label', `${title}, action ${slot + 1}, type`);
          actionLabels.forEach((text, value) => {
            const option = new Option(text, value);
            type.add(option);
          });
          type.value = action.action;
          type.onchange = () => { action.action = Number(type.value); action.arg = 0; markDirty(); render(); };
          typeLabel.append(type);
          const targetLabel = document.createElement('div');
          targetLabel.className = 'action-target';
          const targets = document.createElement('span');
          targets.className = action.action === 1 ? 'target-controls' : 'target-controls navigation';
          if (action.action === 1) {
            const select = document.createElement('select');
            select.setAttribute('aria-label', `${title}, action ${slot + 1}, preset`);
            for (let index = 0; index < 100; index++) select.add(new Option(presetLabel(index), index));
            select.value = action.arg;
            select.onchange = () => { action.arg = Number(select.value); markDirty(); };
            targets.append(select);
          } else {
            const group = document.createElement('select');
            group.setAttribute('aria-label', `${title}, slot ${slot + 1}, destination group`);
            for (let index = 0; index < 16; index++)
              group.add(new Option(index < 12 ? `Group ${index + 1}` : `Extended group ${index - 11}`, index));
            group.value = action.arg & 15;
            const destination = document.createElement('select');
            destination.setAttribute('aria-label', `${title}, slot ${slot + 1}, destination slot`);
            for (let index = 0; index < 8; index++) destination.add(new Option(`Slot ${index + 1}`, index));
            destination.value = action.arg >> 4;
            const change = () => { action.arg = (Number(destination.value) << 4) | Number(group.value); markDirty(); render(); };
            group.onchange = destination.onchange = change;
            targets.append(group, destination);
          }
          targetLabel.append(targets);
          row.append(number, typeLabel, targetLabel);
          card.append(row);
        });
        root.append(card);
      });
      updateControls();
    }
    function validateGroups(list) {
      if (!Array.isArray(list) || list.length !== 16)
        throw new Error('Invalid group count.');
      list.forEach((actions) => {
        if (!Array.isArray(actions) || actions.length !== 8)
          throw new Error('Every group needs exactly 8 slots.');
        actions.forEach(({ action, arg }) => {
          if (!Number.isInteger(action) || action < 0 || action > 1 || !Number.isInteger(arg) ||
              arg < 0 || arg > (action === 1 ? 99 : 127))
            throw new Error('Invalid action, preset index, or navigation destination.');
        });
      });
    }
    function apiPacket(command, requestToken, payload) {
      return new Uint8Array([1, command, requestToken, ...payload]);
    }
    async function write(bytes) {
      if (!connected()) throw new Error('Bluetooth connection lost.');
      if (characteristic.properties.write) await characteristic.writeValueWithResponse(new Uint8Array(bytes));
      else await characteristic.writeValueWithoutResponse(new Uint8Array(bytes));
    }
    function request(command, payload, requestToken) {
      if (pending) return Promise.reject(new Error('Another device request is still pending.'));
      return new Promise((resolve, reject) => {
        let written = false, response = null;
        const timer = setTimeout(() => {
          if (pending?.timer !== timer) return;
          pending = null;
          reject(new Error('Device response timed out. Check that the preset-management firmware is installed.'));
        }, 4000);
        pending = { command, token: requestToken, resolve(value) {
          response = value;
          if (written) resolve(value);
        }, reject, timer };
        // Notifications may arrive before the GATT write completes.
        configurationCharacteristic.writeValueWithResponse(apiPacket(command, requestToken, payload)).then(() => {
          written = true;
          if (response !== null) resolve(response);
        }).catch((error) => {
          if (pending?.timer === timer) { clearTimeout(timer); pending = null; }
          reject(error);
        });
      });
    }
    function nextToken() { token = token % 255 + 1; return token; }
    function parseNamePacket(bytes) {
      if (bytes.length !== 212 || bytes[2] !== 0xf0 || bytes[211] !== 0xf7 || bytes[5] !== 1 || bytes[6] !== 5)
        return null;
      if (bytes[7] > 15 || bytes[8] > 15) throw new Error('Invalid GP-5 name-list index.');
      const first = (bytes[7] * 16 + bytes[8]) * 5;
      if (first > 95) throw new Error('GP-5 name-list index is outside 0-99.');
      const result = [];
      for (let slot = 0; slot < 5; slot++) {
        let text = '';
        for (let offset = 0; offset < 20; offset += 2) {
          const high = bytes[23 + slot * 40 + offset], low = bytes[24 + slot * 40 + offset];
          if (high > 15 || low > 15) throw new Error('Invalid GP-5 name encoding.');
          text += String.fromCharCode(high * 16 + low);
        }
        result.push(text.replace(/\0.*$/, '').trim());
      }
      return { first, names: result };
    }
    function handleConfiguration(event) {
      const view = event.target.value;
      const bytes = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
      if (bytes.length >= 3 && pending && bytes[2] === pending.token && bytes[1] === pending.command) {
        const current = pending; pending = null; clearTimeout(current.timer);
        if (bytes[0] !== 1 || bytes.length < 4) current.reject(new Error('Invalid configuration response.'));
        else if (bytes[3] !== 0) current.reject(new Error(['', 'Firmware rejected the request.', 'Invalid preset configuration.', 'Flash save failed.'][bytes[3]] || 'Unknown firmware error.'));
        else if (bytes.length !== (current.command === 1 ? 132 : 4)) current.reject(new Error('Invalid configuration response length.'));
        else current.resolve(Array.from(bytes.slice(4)));
      }
    }
    function handleMIDI(event) {
      const view = event.target.value;
      const bytes = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
      if (!namePending) return;
      try {
        const packet = parseNamePacket(bytes);
        if (packet) {
          packet.names.forEach((name, offset) => { namePending.names[packet.first + offset] = name; namePending.received.add(packet.first + offset); });
          element('names-status').textContent = `Fetching names: ${namePending.received.size} / 100`;
          if (namePending.received.size === 100) namePending.finish();
        } else if (bytes.length === 16 && bytes[5] === 1 && bytes[6] === 5 && bytes[7] === 1 && bytes[8] === 4 && bytes.at(-1) === 0xf7) {
          console.info(`GP-5 name-list end marker received: ${namePending.received.size} / 100 names collected.`);
        }
      } catch (error) { namePending?.fail(error); }
    }
    async function fetchNames() {
      const currentSession = session;
      names = Array(100).fill('');
      element('names-status').hidden = false;
      element('names-status').textContent = 'Requesting preset names from the GP-5...';
      render();
      try {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            const missing = Array.from({ length: 100 }, (_, index) => index).filter(index => !current.received.has(index));
            current.fail(new Error(`GP-5 name request timed out: received ${current.received.size} / 100 names. Missing indexes: ${missing.join(', ')}. Check MIDI notifications and both BLE links' MTU (at least 215).`));
          }, 12000);
          const current = {
            names: Array(100).fill(''), received: new Set(),
            finish() { clearTimeout(timer); names = current.names; namePending = null; resolve(); },
            fail(error) { clearTimeout(timer); namePending = null; reject(error); }
          };
          namePending = current;
          (async () => {
            await write(START_SYNC);
            await new Promise((done) => setTimeout(done, 100));
            if (namePending !== current) return;
            await write(REQUEST_NAMES);
          })().catch((error) => { if (namePending === current) current.fail(error); });
        });
        element('names-status').textContent = 'Preset names loaded / indexes 0-99.';
      } catch (error) {
        if (session !== currentSession) return;
        element('names-status').textContent = 'Names unavailable. Showing preset indexes 0-99 only.';
        notify(`Preset names unavailable: ${error.message} Using indexes only.`, true);
      }
      render();
    }
    async function loadGroups() {
      const requestToken = nextToken();
      const map = await request(1, [], requestToken);
      const list = Array.from({ length: 16 }, (_, group) => Array.from({ length: 8 }, (_, slot) => {
        const entry = map[group * 8 + slot];
        return { action: entry >> 7, arg: entry & 127 };
      }));
      validateGroups(list);
      groups = list; loaded = true; dirty = false;
      render();
      notify('Preset actions loaded from your controller.');
    }
    async function reloadFromDevice() {
      const currentSession = session;
      // A missing/older management API must not prevent requesting GP-5 names.
      try { await loadGroups(); }
      catch (error) { if (session === currentSession) notify(`Cannot load preset actions: ${error.message}`, true); }
      if (session !== currentSession || !connected()) return;
      await fetchNames();
    }
    async function operation(work) {
      if (busy) return;
      busy = true; updateControls();
      const currentSession = session;
      try { await work(); }
      catch (error) { if (session === currentSession) notify(error.message, true); }
      finally { if (session === currentSession) { busy = false; updateControls(); } }
    }
    function onDisconnected() {
      session++;
      characteristic?.removeEventListener('characteristicvaluechanged', handleMIDI);
      configurationCharacteristic?.removeEventListener('characteristicvaluechanged', handleConfiguration);
      characteristic = configurationCharacteristic = null; busy = false;
      if (pending) { clearTimeout(pending.timer); pending.reject(new Error('Bluetooth disconnected.')); pending = null; }
      namePending?.fail(new Error('Bluetooth disconnected.'));
      updateControls();
      notify('Disconnected. Unsaved edits stay on this page; reconnecting reloads the controller.', true);
    }
    async function connect() {
      if (dirty && !window.confirm('Connecting will replace your unsaved edits with the controller configuration. Continue?')) return;
      await operation(async () => {
        try {
          device?.removeEventListener('gattserverdisconnected', onDisconnected);
          device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'GP5 Proxy' }], optionalServices: [MIDI_SERVICE, CONFIGURATION_SERVICE] });
          device.addEventListener('gattserverdisconnected', onDisconnected);
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(MIDI_SERVICE);
          characteristic = await service.getCharacteristic(MIDI_CHARACTERISTIC);
          characteristic.addEventListener('characteristicvaluechanged', handleMIDI);
          await characteristic.startNotifications();
          const configurationService = await server.getPrimaryService(CONFIGURATION_SERVICE);
          configurationCharacteristic = await configurationService.getCharacteristic(CONFIGURATION_CHARACTERISTIC);
          configurationCharacteristic.addEventListener('characteristicvaluechanged', handleConfiguration);
          await configurationCharacteristic.startNotifications();
        } catch (error) {
          if (device?.gatt.connected) device.gatt.disconnect();
          characteristic?.removeEventListener('characteristicvaluechanged', handleMIDI);
          configurationCharacteristic?.removeEventListener('characteristicvaluechanged', handleConfiguration);
          characteristic = configurationCharacteristic = null;
          throw new Error(`Connection failed: ${error.message}`);
        }
        loaded = false;
        element('device-info').textContent = device.name || 'GP5 Proxy';
        updateControls();
        await reloadFromDevice();
      });
    }
    element('connect').onclick = connect;
    element('disconnect').onclick = () => device?.gatt.disconnect();
    element('reload').onclick = () => {
      if (dirty && !window.confirm('Discard unsaved changes and reload from the controller?')) return;
      return operation(reloadFromDevice);
    };
    element('save').onclick = () => operation(async () => {
      validateGroups(groups);
      const requestToken = nextToken();
      notify('Saving preset actions. Keep the controller connected...');
      await request(4, groups.flatMap(actions => actions.map(({ action, arg }) => (action << 7) | arg)), requestToken);
      dirty = false;
      notify('Saved to controller flash. Your groups are ready to play.');
    });
    window.addEventListener('beforeunload', (event) => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
    if (!supported) {
      element('compatibility').hidden = false;
      element('compatibility').textContent = !window.isSecureContext ? 'Bluetooth requires HTTPS or localhost.' : 'Use Chrome or Edge with Web Bluetooth support (desktop or Android). Safari and Firefox are not supported.';
    }
    updateControls();

    let installPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => { event.preventDefault(); installPrompt = event; element('install').hidden = false; });
    element('install').onclick = async () => {
      if (!installPrompt) return;
      const prompt = installPrompt; installPrompt = null; element('install').hidden = true;
      try { await prompt.prompt(); await prompt.userChoice; } catch (error) { notify(`Installation failed: ${error.message}`, true); }
    };
    window.addEventListener('appinstalled', () => { installPrompt = null; element('install').hidden = true; });
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(() => {
        element('offline-status').textContent = 'Ready for offline use';
      }).catch((error) => { element('offline-status').textContent = 'Offline cache unavailable'; notify(`Offline setup failed: ${error.message}`, true); });
    } else element('offline-status').textContent = 'Offline cache unavailable';
  </script>
</body>
</html>
